<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0057b8;
    overflow-x:hidden;
}

.pe-catalogo{
    position:relative;
    width:100%;
    min-height:100vh;
    padding:18px 12px 0;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 20%),
        radial-gradient(circle at 80% 40%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(180deg,#0075d9 0%,#0057bd 50%,#003e9e 100%);
    color:#fff;
}

/* =====================================================
   MARCO TRICOLOR ANIMADO
===================================================== */

.pe-marco{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
    border:12px solid transparent;
    background:
        linear-gradient(#0057b8,#0057b8) padding-box,
        conic-gradient(
            from 0deg,
            #006847,
            #ffffff,
            #ce1126,
            #ffffff,
            #006847
        ) border-box;
    animation:girarMarco 5s linear infinite;
}

@keyframes girarMarco{

    0%{
        background:
            linear-gradient(#0057b8,#0057b8) padding-box,
            conic-gradient(
                from 0deg,
                #006847,
                #ffffff,
                #ce1126,
                #ffffff,
                #006847
            ) border-box;
    }

    100%{
        background:
            linear-gradient(#0057b8,#0057b8) padding-box,
            conic-gradient(
                from 360deg,
                #006847,
                #ffffff,
                #ce1126,
                #ffffff,
                #006847
            ) border-box;
    }
}

/* =====================================================
   BURBUJAS
===================================================== */

.pe-burbuja{
    position:absolute;
    bottom:-80px;
    z-index:1;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.10);
    border-radius:50%;
    pointer-events:none;
    animation:subir linear infinite;
}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    10%{
        opacity:.7;
    }

    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}

.pe-contenido{
    position:relative;
    z-index:10;
    width:100%;
    max-width:1050px;
    margin:0 auto;
}

/* =====================================================
   BANNER
===================================================== */

.pe-banner{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.3);
}

.pe-banner img{
    display:block;
    width:100%;
    height:auto;
}

/* =====================================================
   RELOJ
===================================================== */

.pe-reloj{
    width:100%;
    text-align:center;
    margin:8px auto 12px;
    padding:10px 5px;
    background:rgba(0,0,0,.30);
    border-radius:12px;
}

#pe-saludo{
    display:block;
    font-size:clamp(25px,5.5vw,38px);
    font-weight:900;
}

#pe-hora{
    display:block;
    min-height:42px;
    margin-top:6px;
    font-size:clamp(30px,7.5vw,46px);
    font-weight:900;
    letter-spacing:2px;
}

#pe-fecha{
    display:block;
    min-height:24px;
    margin-top:5px;
    font-size:clamp(17px,3.8vw,22px);
    font-weight:700;
}

/* =====================================================
   CARRUSEL
===================================================== */

.pe-carrusel{
    width:100%;
    max-width:480px;
    margin:10px auto 18px;
    display:flex;
    align-items:center;
    gap:6px;
}

.pe-carrusel-ventana{
    flex:1;
    min-width:0;
    overflow:hidden;
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.pe-carrusel-pista{
    display:flex;
    width:100%;
    transform:translateX(0);
    transition:transform:.4s ease;
}

.pe-slide{
    flex:0 0 100%;
    width:100%;
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
}

.pe-slide img{
    width:100%;
    height:145px;
    display:block;
    object-fit:contain;
}

.pe-boton-carrusel{
    flex:0 0 38px;
    width:38px;
    height:38px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#0057b8;
    font-size:28px;
    font-weight:bold;
    line-height:38px;
    text-align:center;
    cursor:pointer;
}

/* =====================================================
   TITULOS
===================================================== */

.pe-titulo{
    text-align:center;
    font-size:clamp(24px,5.5vw,34px);
    font-weight:900;
    margin:12px 0 6px;
}

.pe-actualizado{
    text-align:center;
    font-size:clamp(16px,3.8vw,21px);
    font-weight:bold;
    margin-bottom:14px;
}

/* =====================================================
   CATALOGO
===================================================== */

.pe-catalogo-paginas{
    width:100%;
    margin:0 auto;
}

.pe-pagina-catalogo{
    width:100%;
    margin:0 0 14px;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 5px 16px rgba(0,0,0,.3);
}

.pe-pagina-catalogo img{
    width:100%;
    height:auto;
    display:block;
}

/* =====================================================
   PDF
===================================================== */

.pe-descarga-pdf{
    width:100%;
    margin:8px 0 18px;
}

.pe-descarga-pdf a{
    display:block;
    width:100%;
    padding:16px 6px;
    text-align:center;
    text-decoration:none;
    color:#fff;

    background:linear-gradient(
        90deg,
        #006847,
        #008f5a,
        #0057b8,
        #ce1126
    );

    background-size:200% 100%;
    animation:brillo 3s linear infinite;

    border:3px solid #fff;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.35);

    font-size:clamp(21px,5.2vw,31px);
    font-weight:900;
}

.pe-flecha{
    display:inline-block;
    animation:moverFlecha 1s infinite;
}

.pe-flecha.derecha{
    animation-delay:.25s;
}

@keyframes moverFlecha{
    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(7px);
    }
}

@keyframes brillo{
    0%{
        background-position:0 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0 50%;
    }
}

/* =====================================================
   NUEVA CAMPAÑA
===================================================== */

.pe-campana{
    width:100%;
    max-width:850px;
    margin:18px auto 20px;
    text-align:center;
}

.pe-campana button{
    width:100%;
    padding:17px 8px;

    border:3px solid #fff;
    border-radius:18px;

    background:linear-gradient(
        90deg,
        #006847,
        #009b63,
        #0057b8,
        #ce1126
    );

    background-size:300% 100%;
    animation:campanaBrillo 4s linear infinite;

    color:#fff;
    font-size:clamp(21px,5.5vw,32px);
    font-weight:900;

    box-shadow:0 6px 18px rgba(0,0,0,.35);
    cursor:pointer;
}

.pe-campana button span{
    display:inline-block;
    animation:campanaFlecha 1s infinite;
}

@keyframes campanaFlecha{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(8px);
    }
}

@keyframes campanaBrillo{

    0%{
        background-position:0 50%;
    }

    100%{
        background-position:300% 50%;
    }
}

/* =====================================================
   POPUP VIDEO
===================================================== */

.pe-modal-campana{
    display:none;
    position:fixed;
    z-index:99999;
    inset:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,.86);

    align-items:center;
    justify-content:center;

    padding:12px;
}

.pe-modal-campana.activo{
    display:flex;
}

.pe-video-contenedor{
    position:relative;
    width:100%;
    max-width:900px;

    background:#000;

    border:3px solid #fff;
    border-radius:16px;

    overflow:hidden;

    box-shadow:0 10px 40px rgba(0,0,0,.7);
}

.pe-video-contenedor iframe{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    border:0;
}

.pe-cerrar-campana{
    position:absolute;
    z-index:10;

    top:7px;
    right:7px;

    width:43px;
    height:43px;

    border:2px solid #fff;
    border-radius:50%;

    background:#ce1126;
    color:#fff;

    font-size:24px;
    font-weight:900;

    cursor:pointer;
}

/* =====================================================
   POPUPS PROMOCIONALES
===================================================== */

.pe-modal-promo{
    display:none;

    position:fixed;
    z-index:99998;

    inset:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,.78);

    align-items:center;
    justify-content:center;

    padding:12px;
}

.pe-modal-promo.activo{
    display:flex;
}

.pe-promo-contenedor{
    position:relative;

    width:min(92vw,560px);
    max-height:92vh;

    background:#fff;

    border-radius:18px;
    overflow:hidden;

    box-shadow:0 10px 40px rgba(0,0,0,.65);

    animation:promoEntrada .4s ease;
}

@keyframes promoEntrada{

    from{
        transform:scale(.85);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.pe-promo-contenedor img{
    display:block;

    width:100%;
    max-height:75vh;

    object-fit:contain;

    background:#fff;
}

.pe-promo-texto{
    padding:12px 10px 16px;

    text-align:center;

    color:#0057b8;

    font-size:clamp(19px,4.8vw,27px);
    font-weight:900;

    line-height:1.25;
}

.pe-promo-cerrar{
    position:absolute;
    z-index:5;

    top:8px;
    right:8px;

    width:43px;
    height:43px;

    border:2px solid #fff;
    border-radius:50%;

    background:#ce1126;
    color:#fff;

    font-size:24px;
    font-weight:900;

    cursor:pointer;

    box-shadow:0 3px 8px rgba(0,0,0,.4);
}

/* =====================================================
   WHATSAPP
===================================================== */

.pe-whatsapp{
    width:100%;
    max-width:600px;
    margin:18px auto 16px;
    text-align:center;
}

.pe-whatsapp a{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    text-decoration:none;
    color:#fff;

    background:#25D366;

    padding:13px 15px;

    border-radius:50px;

    font-size:clamp(19px,4.5vw,24px);
    font-weight:900;

    box-shadow:0 5px 14px rgba(0,0,0,.3);
}

.pe-whatsapp img{
    width:55px;
    height:55px;
    object-fit:contain;
}

/* =====================================================
   LOGOS
===================================================== */

.pe-logos-finales{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;

    gap:15px;

    width:100%;

    margin:10px auto 15px;
}

.pe-logos-finales img{
    display:block;

    width:auto;
    max-width:45%;
    max-height:100px;

    object-fit:contain;
}

/* =====================================================
   FOOTER
===================================================== */

.pe-footer{
    width:100%;

    text-align:center;

    padding:10px 8px 14px;

    font-size:clamp(15px,3.5vw,19px);

    font-weight:bold;

    line-height:1.5;
}

/* =====================================================
   MOVIL
===================================================== */

@media(max-width:600px){

    .pe-catalogo{
        padding:14px 6px 0;
    }

    .pe-marco{
        border-width:9px;
    }

    .pe-slide{
        height:115px;
    }

    .pe-slide img{
        height:115px;
    }

    .pe-boton-carrusel{
        flex-basis:33px;
        width:33px;
        height:33px;
        line-height:33px;
        font-size:23px;
    }

    .pe-logos-finales img{
        max-height:80px;
    }

    .pe-video-contenedor{
        border-radius:12px;
    }

    .pe-cerrar-campana{
        width:40px;
        height:40px;
        font-size:22px;
    }

    .pe-promo-contenedor{
        width:94vw;
        max-height:90vh;
    }

    .pe-promo-contenedor img{
        max-height:70vh;
    }

}

/* =====================================================
   EVITAR SELECCION ACCIDENTAL EN BOTONES
===================================================== */

button{
    -webkit-tap-highlight-color:transparent;
}

</style>
</head>
