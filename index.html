html,body{

body{

.pe-catalogo{
    position:relative;
    width:100%;
    min-height:100vh;
    padding:18px 12px 0;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 20%),
        radial-gradient(circle at 80% 40%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(180deg,#0075d9 0%,#0057bd 50%,#003e9e 100%);
    color:#fff;
}

/* MARCO */

.pe-marco{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
    border:12px solid #fff;
    box-shadow:
        inset 0 0 0 5px #006847,
        inset 0 0 0 10px #fff,
        inset 0 0 0 15px #ce1126;
}

/* BURBUJAS */

.pe-burbuja{
    position:absolute;
    bottom:-80px;
    z-index:1;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.10);
    border-radius:50%;
    pointer-events:none;
    animation:subir linear infinite;
}

@keyframes subir{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    10%{
        opacity:.7;
    }
    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}

.pe-contenido{

/* BANNER */

.pe-banner{

.pe-banner img{

/* RELOJ */

.pe-reloj{

#pe-saludo{

#pe-hora{

#pe-fecha{

    min-height:24px;
    margin-top:5px;

    font-weight:700;
}

/* CARRUSEL */

.pe-carrusel{
    width:100%;
    max-width:480px;
    margin:10px auto 18px;
    display:flex;
    align-items:center;
    gap:6px;
}

.pe-carrusel-ventana{
    flex:1;
    min-width:0;
    overflow:hidden;
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.pe-carrusel-pista{
    display:flex;
    width:100%;
    transform:translateX(0);
    transition:transform:.4s ease;
}

.pe-slide{
    flex:0 0 100%;
    width:100%;
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
}

.pe-slide img{
    width:100%;
    height:145px;
    display:block;
    object-fit:contain;
}

.pe-boton-carrusel{
    flex:0 0 38px;
    width:38px;
    height:38px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#0057b8;
    font-size:28px;
    font-weight:bold;
    line-height:38px;
    text-align:center;
    cursor:pointer;
}

/* TITULOS */

.pe-titulo{

.pe-actualizado{

    font-weight:bold;
    margin-bottom:14px;
}

/* CATALOGO */

.pe-catalogo-paginas{

}

.pe-pagina-catalogo{
    width:100%;

    border-radius:8px;

}

.pe-pagina-catalogo img{

    height:auto;
    display:block;
}

/* PDF */

.pe-descarga-pdf{

.pe-descarga-pdf a{

    padding:15px 6px;

    text-decoration:none;
    color:#fff;
    background:linear-gradient(
        90deg,

        #008f5a,
        #0057b8,

    );
    background-size:200% 100%;
    animation:brillo 3s linear infinite;
    border:3px solid #fff;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.35);
    font-size:clamp(19px,5vw,30px);

}

.pe-flecha{
    display:inline-block;
    animation:moverFlecha 1s infinite;
}

.pe-flecha.derecha{
    animation-delay:.25s;
}

@keyframes moverFlecha{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(7px);}
}

@keyframes brillo{
    0%{background-position:0 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0 50%;}
}

<script>

/* RELOJ */

(function(){

    function actualizarReloj(){

        var ahora = new Date();

        var horas = ahora.getHours();
        var minutos = ahora.getMinutes();
        var segundos = ahora.getSeconds();

        var hora =
            String(horas).padStart(2,"0") +
            ":" +
            String(minutos).padStart(2,"0") +
            ":" +
            String(segundos).padStart(2,"0");

        var dias = [
            "domingo",
            "lunes",
            "martes",
            "miércoles",
            "jueves",
            "viernes",
            "sábado"
        ];

        var meses = [
            "enero",
            "febrero",
            "marzo",
            "abril",
            "mayo",
            "junio",
            "julio",
            "agosto",
            "septiembre",
            "octubre",
            "noviembre",
            "diciembre"
        ];

        var fecha =
            dias[ahora.getDay()] +
            " " +
            ahora.getDate() +
            " de " +
            meses[ahora.getMonth()] +
            " de " +
            ahora.getFullYear();

        fecha =
            fecha.charAt(0).toUpperCase() +
            fecha.slice(1);

        var horaElemento =
            document.getElementById("pe-hora");

        var fechaElemento =
            document.getElementById("pe-fecha");

        var saludoElemento =
            document.getElementById("pe-saludo");

        if(horaElemento){
            horaElemento.textContent = hora;
        }

        if(fechaElemento){
            fechaElemento.textContent = fecha;
        }

        if(saludoElemento){

            if(horas >= 5 && horas < 12){

                saludoElemento.textContent =
                    "Buenos días ☀️";

            }

            else if(horas >= 12 && horas < 19){

                saludoElemento.textContent =
                    "Buenas tardes 🌤️";

            }

            else{

                saludoElemento.textContent =
                    "Buenas noches 🌙";

            }

        }

    }

    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",
            actualizarReloj
        );

    }else{

        actualizarReloj();

    }

    setInterval(
        actualizarReloj,
        1000
    );

})();


/* CARRUSEL */

(function(){

    function iniciarCarrusel(){

        var pista =
            document.getElementById("pe-pista");

        var botonAnterior =
            document.getElementById("pe-prev");

        var botonSiguiente =
            document.getElementById("pe-next");

        if(!pista || !botonAnterior || !botonSiguiente){
            return;
        }

        var slides =
            pista.querySelectorAll(".pe-slide");

        var total =
            slides.length;

        var indice = 0;


        function mostrarSlide(){

            pista.style.transform =
                "translate3d(-" +
                (indice * 100) +
                "%, 0, 0)";

        }


        botonAnterior.onclick = function(e){

            e.preventDefault();
            e.stopPropagation();

            indice--;

            if(indice < 0){
                indice = total - 1;
            }

            mostrarSlide();

        };


        botonSiguiente.onclick = function(e){

            e.preventDefault();
            e.stopPropagation();

            indice++;

            if(indice >= total){
                indice = 0;
            }

            mostrarSlide();

        };


        mostrarSlide();


        setInterval(
            function(){

                indice++;

                if(indice >= total){
                    indice = 0;
                }

                mostrarSlide();

            },
            3000
        );

    }


    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",
            iniciarCarrusel
        );

    }else{

        iniciarCarrusel();

    }

})();

</script>
