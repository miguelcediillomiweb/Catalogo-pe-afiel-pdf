<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0057b8;
    overflow-x:hidden;
}

.pe-catalogo{
    position:relative;
    width:100%;
    min-height:100vh;
    padding:18px 12px 0;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 20%),
        radial-gradient(circle at 80% 40%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(180deg,#0075d9 0%,#0057bd 50%,#003e9e 100%);
    color:#fff;
}

.pe-marco{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
    border:12px solid #fff;
    box-shadow:
        inset 0 0 0 5px #006847,
        inset 0 0 0 10px #fff,
        inset 0 0 0 15px #ce1126;
}

.pe-burbuja{
    position:absolute;
    bottom:-80px;
    z-index:1;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.10);
    border-radius:50%;
    pointer-events:none;
    animation:subir linear infinite;
}

@keyframes subir{
    0%{transform:translateY(0);opacity:0;}
    10%{opacity:.7;}
    100%{transform:translateY(-120vh);opacity:0;}
}

.pe-contenido{
    position:relative;
    z-index:10;
    width:100%;
    max-width:1050px;
    margin:0 auto;
}

.pe-banner{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.3);
}

.pe-banner img{
    display:block;
    width:100%;
    height:auto;
}

/* RELOJ */

.pe-reloj{
    width:100%;
    text-align:center;
    margin:10px auto 16px;
    padding:14px 8px;
    background:rgba(0,0,0,.30);
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

#pe-saludo{
    display:block;
    font-size:clamp(25px,6vw,38px);
    font-weight:900;
}

#pe-hora{
    display:block;
    min-height:48px;
    margin-top:6px;
    font-size:clamp(32px,8vw,48px);
    font-weight:900;
    letter-spacing:2px;
}

#pe-fecha{
    display:block;
    min-height:28px;
    margin-top:5px;
    font-size:clamp(17px,4vw,23px);
    font-weight:700;
}

/* CARRUSEL */

.pe-carrusel{
    width:100%;
    max-width:480px;
    margin:12px auto 20px;
    display:flex;
    align-items:center;
    gap:7px;
}

.pe-carrusel-ventana{
    flex:1;
    min-width:0;
    overflow:hidden;
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.pe-carrusel-pista{
    display:flex;
    width:100%;
    transform:translateX(0);
    transition:transform:.45s ease;
}

.pe-slide{
    flex:0 0 100%;
    width:100%;
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
}

.pe-slide img{
    width:100%;
    height:145px;
    display:block;
    object-fit:contain;
}

.pe-boton-carrusel{
    flex:0 0 40px;
    width:40px;
    height:40px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#0057b8;
    font-size:30px;
    font-weight:bold;
    line-height:40px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
}

/* TITULOS */

.pe-titulo{
    text-align:center;
    font-size:clamp(25px,6vw,36px);
    font-weight:900;
    margin:14px 0 7px;
}

.pe-actualizado{
    text-align:center;
    font-size:clamp(16px,4vw,21px);
    font-weight:bold;
    margin-bottom:16px;
}

/* CATALOGO */

.pe-catalogo-paginas{
    width:100%;
    margin:0 auto;
}

.pe-pagina-catalogo{
    width:100%;
    margin:0 0 14px;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 5px 16px rgba(0,0,0,.3);
}

.pe-pagina-catalogo img{
    width:100%;
    height:auto;
    display:block;
}

/* PDF */

.pe-descarga-pdf{
    width:100%;
    margin:9px 0 20px;
}

.pe-descarga-pdf a{
    display:block;
    width:100%;
    padding:17px 6px;
    text-align:center;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(
        90deg,
        #006847,
        #008f5a,
        #0057b8,
        #ce1126
    );
    background-size:200% 100%;
    animation:brillo 3s linear infinite;
    border:3px solid #fff;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.35);
    font-size:clamp(21px,5.5vw,31px);
    font-weight:900;
}

.pe-flecha{
    display:inline-block;
    animation:moverFlecha 1s infinite;
}

.pe-flecha.derecha{
    animation-delay:.25s;
}

@keyframes moverFlecha{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(7px);}
}

@keyframes brillo{
    0%{background-position:0 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0 50%;}
}

/* NUEVA CAMPAÑA */

.pe-campana{
    width:100%;
    max-width:900px;
    margin:18px auto 22px;
    text-align:center;
}

.pe-campana button{
    width:100%;
    border:3px solid #fff;
    border-radius:18px;
    padding:18px 8px;
    background:linear-gradient(
        90deg,
        #006847,
        #009b63,
        #0057b8,
        #ce1126
    );
    background-size:300% 100%;
    animation:campanaBrillo 4s linear infinite;
    color:#fff;
    font-size:clamp(21px,5.5vw,33px);
    font-weight:900;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    cursor:pointer;
}

.pe-campana button span{
    display:inline-block;
    animation:campanaFlecha 1s infinite;
}

@keyframes campanaFlecha{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(9px);}
}

@keyframes campanaBrillo{
    0%{background-position:0 50%;}
    100%{background-position:300% 50%;}
}

/* VIDEO POPUP */

.pe-modal-campana{
    display:none;
    position:fixed;
    z-index:100000;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.86);
    align-items:center;
    justify-content:center;
    padding:12px;
}

.pe-modal-campana.activo{
    display:flex;
}

.pe-video-contenedor{
    position:relative;
    width:100%;
    max-width:900px;
    background:#000;
    border:3px solid #fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.7);
}

.pe-video-contenedor iframe{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    border:0;
}

.pe-cerrar-campana{
    position:absolute;
    z-index:10;
    top:7px;
    right:7px;
    width:43px;
    height:43px;
    border:2px solid #fff;
    border-radius:50%;
    background:#ce1126;
    color:#fff;
    font-size:24px;
    font-weight:900;
    cursor:pointer;
}

/* WHATSAPP */

.pe-whatsapp{
    width:100%;
    max-width:650px;
    margin:18px auto 18px;
    text-align:center;
}

.pe-whatsapp a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-decoration:none;
    color:#fff;
    background:#25D366;
    padding:14px 16px;
    border-radius:50px;
    font-size:clamp(19px,4.5vw,24px);
    font-weight:900;
    box-shadow:0 5px 14px rgba(0,0,0,.3);
}

.pe-whatsapp img{
    width:58px;
    height:58px;
    object-fit:contain;
}

/* LOGOS */

.pe-logos-finales{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    width:100%;
    margin:8px auto 14px;
}

.pe-logos-finales img{
    display:block;
    width:auto;
    max-width:45%;
    max-height:100px;
    object-fit:contain;
}

/* FOOTER */

.pe-footer{
    width:100%;
    text-align:center;
    padding:10px 8px 18px;
    font-size:clamp(15px,3.5vw,19px);
    font-weight:bold;
    line-height:1.6;
}

/* POPUP PROMOCIONAL */

.pe-modal-promo{
    display:none;
    position:fixed;
    z-index:99998;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.70);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.pe-modal-promo.activo{
    display:flex;
}

.pe-promo-contenedor{
    position:relative;
    width:min(92vw,560px);
    max-height:92vh;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.65);
    animation:promoEntrada .4s ease;
}

@keyframes promoEntrada{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.pe-promo-contenedor img{
    display:block;
    width:100%;
    max-height:72vh;
    object-fit:contain;
    background:#fff;
}

.pe-promo-texto{
    padding:12px 10px 15px;
    text-align:center;
    color:#0057b8;
    font-size:clamp(19px,4.8vw,27px);
    font-weight:900;
    line-height:1.25;
}

.pe-promo-cerrar{
    position:absolute;
    z-index:5;
    top:8px;
    right:8px;
    width:43px;
    height:43px;
    border:2px solid #fff;
    border-radius:50%;
    background:#ce1126;
    color:#fff;
    font-size:24px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.4);
}

/* MOVIL */

@media(max-width:600px){

    .pe-catalogo{
        padding:14px 6px 0;
    }

    .pe-marco{
        border-width:9px;
        box-shadow:
            inset 0 0 0 4px #006847,
            inset 0 0 0 8px #fff,
            inset 0 0 0 12px #ce1126;
    }

    .pe-slide{
        height:115px;
    }

    .pe-slide img{
        height:115px;
    }

    .pe-boton-carrusel{
        flex-basis:34px;
        width:34px;
        height:34px;
        line-height:34px;
        font-size:24px;
    }

    .pe-logos-finales img{
        max-height:80px;
    }

    .pe-modal-campana{
        padding:8px;
    }

    .pe-video-contenedor{
        border-radius:12px;
    }

    .pe-cerrar-campana{
        width:39px;
        height:39px;
        font-size:21px;
    }
}
</style>
</head>
