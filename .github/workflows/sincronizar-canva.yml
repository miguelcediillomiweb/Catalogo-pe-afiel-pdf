name: Sincronizar catálogo desde Canva

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Exportar páginas directamente desde Canva
        env:
          CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
        run: |
          if [ -z "$CANVA_ACCESS_TOKEN" ]; then
            echo "Falta el secreto CANVA_ACCESS_TOKEN en GitHub."
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");

          const token = process.env.CANVA_ACCESS_TOKEN;

          const diseños = [
            {
              id: "DAHV8TMPWN8",
              archivo: "catalogo-pag-1.png"
            },
            {
              id: "DAHWBYZVjfU",
              archivo: "catalogo-pag-2.png"
            }
          ];

          async function canva(path, options = {}) {
            const response = await fetch("https://api.canva.com/rest/v1" + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {})
              }
            });

            const text = await response.text();
            let data;
            try {
              data = JSON.parse(text);
            } catch {
              throw new Error(`Canva devolvió HTTP ${response.status}: ${text.slice(0, 500)}`);
            }

            if (!response.ok) {
              throw new Error(`Canva devolvió HTTP ${response.status}: ${JSON.stringify(data)}`);
            }

            return data;
          }

          async function exportar(diseño) {
            console.log("Solicitando exportación PNG:", diseño.id);

            const creado = await canva("/exports", {
              method: "POST",
              body: JSON.stringify({
                design_id: diseño.id,
                format: {
                  type: "png",
                  lossless: true
                }
              })
            });

            const exportId = creado?.job?.id;
            if (!exportId) {
              throw new Error("Canva no devolvió el ID del trabajo de exportación.");
            }

            console.log("Trabajo Canva:", exportId);

            for (let intento = 1; intento <= 30; intento++) {
              await new Promise(resolve => setTimeout(resolve, 4000));

              const estado = await canva("/exports/" + exportId);
              console.log("Estado exportación:", estado?.job?.status);

              if (estado?.job?.status === "failed") {
                throw new Error(
                  "Canva no pudo exportar " + diseño.id + ": " +
                  JSON.stringify(estado?.job?.error || {})
                );
              }

              if (estado?.job?.status === "success") {
                const url = estado?.job?.urls?.[0];
                if (!url) {
                  throw new Error("Canva terminó la exportación pero no entregó una URL.");
                }

                const imagen = await fetch(url);
                if (!imagen.ok) {
                  throw new Error("No se pudo descargar el PNG exportado: HTTP " + imagen.status);
                }

                const buffer = Buffer.from(await imagen.arrayBuffer());
                if (buffer.length < 10000) {
                  throw new Error("El PNG descargado parece inválido o demasiado pequeño.");
                }

                fs.writeFileSync(diseño.archivo, buffer);
                console.log("Generado:", diseño.archivo, buffer.length, "bytes");
                return;
              }
            }

            throw new Error("Canva tardó demasiado en completar la exportación de " + diseño.id);
          }

          (async () => {
            for (const diseño of diseños) {
              await exportar(diseño);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publicar imágenes actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo-pag-1.png catalogo-pag-2.png
          if git diff --cached --quiet; then
            echo "No hubo cambios en Canva."
          else
            git commit -m "Actualizar catálogo desde Canva [skip ci]"
            git push
          fi
